name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (typecheck / lint / format / test / build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  # Linux 后端：平台差异（端口采集、进程保护、路径归一）必须在这里被真正跑到。
  # 之前只有 Windows runner，导致「Linux 白名单恒为空」「LISTEN/LISTENING 不一致」
  # 这类问题无法被发现。
  backend-linux:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev             patchelf libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  backend:
    name: Backend (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # ts-rs 导出是契约快照：Rust 结构体改了但忘记重新导出时，
      # 前端类型会静默漂移。重新生成后必须**零改动**才算通过。
      # 用 git status 而不是 git diff：新增的生成文件是未跟踪状态，
      # git diff 看不到它们，而「新增结构体但忘了提交生成物」正是最常见形态。
      - name: IPC contract drift
        working-directory: src-tauri
        shell: bash
        run: |
          cargo test --test export_bindings
          if [ -n "$(git status --porcelain -- ../src/generated)" ]; then
            echo "::error::src/generated 与 Rust 结构体不一致，请运行 cargo test --test export_bindings 并提交生成结果"
            git status --porcelain -- ../src/generated
            git diff -- ../src/generated
            exit 1
          fi

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck generated contract
        run: npx tsc --noEmit
