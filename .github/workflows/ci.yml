name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (typecheck / lint / format / test / build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      # 图标必须是透明圆角：源图是白底 JPEG，忘了抠会给深色界面
      # 留下一圈白方块，这不在任何类型检查的覆盖范围内。
      - name: Icon contract
        run: python scripts/check_icons.py

      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

      # 视觉回归：捕获布局塌陷、图表标签重叠、元素不可见这类问题。
      # 单元测试和类型检查对它们完全无感。
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Visual regression
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            test-results/
            e2e/snapshots/
          retention-days: 7

  # Linux 后端：平台差异（端口采集、进程保护、路径归一）必须在这里被真正跑到。
  # 之前只有 Windows runner，导致「Linux 白名单恒为空」「LISTEN/LISTENING 不一致」
  # 这类问题无法被发现。
  backend-linux:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev             libayatana-appindicator3-dev patchelf libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # 打包验证：确保 deb 真的能产出。仅编译不打包时，
      # productName/包名/图标布局这类问题不会被发现。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build deb package
        run: npx tauri build --bundles deb

      - name: Verify deb structure
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          echo "built: $deb"
          dpkg-deb -c "$deb" | grep -q "usr/bin/workbench" || { echo "binary missing"; exit 1; }
          dpkg-deb -f "$deb" Package | grep -Eq '^[a-z0-9][a-z0-9.+-]*$' || { echo "invalid package name"; exit 1; }

  backend:
    name: Backend (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # ts-rs 导出是契约快照：Rust 结构体改了但忘记重新导出时，
      # 前端类型会静默漂移。重新生成后必须**零改动**才算通过。
      # 用 git status 而不是 git diff：新增的生成文件是未跟踪状态，
      # git diff 看不到它们，而「新增结构体但忘了提交生成物」正是最常见形态。
      - name: IPC contract drift
        working-directory: src-tauri
        shell: bash
        run: |
          cargo test --test export_bindings
          if [ -n "$(git status --porcelain -- ../src/generated)" ]; then
            echo "::error::src/generated 与 Rust 结构体不一致，请运行 cargo test --test export_bindings 并提交生成结果"
            git status --porcelain -- ../src/generated
            git diff -- ../src/generated
            exit 1
          fi

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck generated contract
        run: npx tsc --noEmit
